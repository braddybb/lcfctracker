<style>
    :root {
    --navy:       #0A0E17;
    --navy-card:  #131A29;
    --border:     #232E45;
    --blue:       #1E4FD6;
    --gold:       #FFC72C;
    --chalk:      #F5F6FA;
    --muted:      #7C8AA5;
    --green:      #22A559;
    --amber:      #F2994A;
    --clay:       #E5484D;
    --radius: 2px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--navy);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  h1, h2, h3, nav.tabs button, .segmented button, .tag, .bench-label, .pitch-slot .slot-label {
    font-family: 'Oswald', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  a { color: var(--gold); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px 80px; }

  /* ---- header banner ---- */
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: linear-gradient(120deg, var(--blue) 0%, var(--blue) 62%, var(--gold) 62%, var(--gold) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 86%, 0 100%);
    padding: 18px 20px 22px; margin: 0 -18px 22px; margin-top: 0;
  }
  header.top .brand { display: flex; align-items: center; gap: 12px; }
  header.top img.crest { width: 44px; height: 44px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  header.top h1 { font-size: 19px; margin: 0; color: var(--navy); text-transform: uppercase; line-height: 1.15; }
  header.top h1 span { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 1px; opacity: 0.75; text-transform: uppercase; }
  #who { font-size: 11px; color: var(--navy); opacity: 0.8; text-align: right; }
  #signout { background: none; border: none; color: var(--navy); text-decoration: underline; cursor: pointer; font-size: 11px; padding: 0; margin-left: 8px; opacity: 0.8; }

  /* ---- nav ---- */
  nav.tabs { display: flex; gap: 2px; margin-bottom: 22px; }
  nav.tabs button {
    flex: 1; background: var(--navy-card); color: var(--muted);
    border: 1px solid var(--border); padding: 10px 4px;
    font-size: 11.5px; letter-spacing: 0.5px; text-transform: uppercase;
    cursor: pointer; border-radius: var(--radius);
  }
  nav.tabs button.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }

  section.view { display: none; }
  section.view.active { display: block; }

  /* ---- cards ---- */
  .card {
    background: var(--navy-card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card h3 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; margin: 0 0 4px; letter-spacing: 0; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .tag {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 2px;
    margin-right: 6px; vertical-align: middle; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .tag.game { background: var(--blue); color: var(--chalk); }
  .tag.training { background: var(--border); color: var(--chalk); }

  /* ---- fixture hero / compact ---- */
  .fixture-hero { border-left-width: 6px; }
  .fixture-hero h3 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; }
  .fixture-row-compact {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 8px; cursor: pointer; background: var(--navy-card);
  }
  .fixture-row-compact:hover { border-color: var(--gold); }
  .frc-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .frc-title { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frc-date { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .frc-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .frc-chevron { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
  .frc-chevron.open { transform: rotate(90deg); }
  .fixture-expanded { margin: -4px 0 8px; padding: 14px 16px 16px; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); background: var(--navy-card); }

  /* ---- segmented rsvp control ---- */
  .segmented { display: flex; gap: 6px; margin-top: 12px; }
  .segmented button {
    flex: 1; border: 1px solid var(--border); background: var(--navy); padding: 9px 0; color: var(--muted);
    font-size: 11px; letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer; border-radius: var(--radius);
  }
  .segmented button.selected.available   { background: var(--green); border-color: var(--green); color: var(--chalk); }
  .segmented button.selected.maybe       { background: var(--amber); border-color: var(--amber); color: var(--navy); }
  .segmented button.selected.unavailable { background: var(--clay); border-color: var(--clay); color: var(--chalk); }
  .segmented.large button { padding: 13px 0; font-size: 12px; }

  .cutoff-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.3px; margin-top: 10px; text-transform: uppercase; }
  .cutoff-label.ok   { color: var(--muted); }
  .cutoff-label.warn { color: var(--amber); }
  .cutoff-label.over { color: var(--clay); }

  .attend-summary { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .attend-summary b { color: var(--chalk); }
  details.roster-detail { margin-top: 10px; }
  details.roster-detail summary { cursor: pointer; color: var(--gold); font-size: 12.5px; }
  .player-line { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--border); font-size: 13px; }
  .status-pill { font-size: 10.5px; padding: 1px 7px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
  .status-pill.available { background: #22A55933; color: #6FE3A0; }
  .status-pill.maybe { background: #F2994A33; color: var(--amber); }
  .status-pill.unavailable { background: #E5484D33; color: #F28B8E; }
  .status-pill.pending { background: #ffffff11; color: var(--muted); }

  /* ---- forms ---- */
  input, select, textarea {
    width: 100%; background: var(--navy); border: 1px solid var(--border); color: var(--chalk);
    padding: 9px 10px; border-radius: var(--radius); font-family: inherit; font-size: 14px; margin-bottom: 10px;
  }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  button.primary {
    background: var(--gold); color: var(--navy); border: none; padding: 10px 18px;
    font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    border-radius: var(--radius); cursor: pointer; font-size: 13.5px;
  }
  button.ghost {
    background: none; color: var(--muted); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }

  /* ---- login ---- */
  .login-screen-outer { max-width: 720px; margin: 0 auto; }
  .login-banner {
    background: linear-gradient(120deg, var(--blue) 0%, var(--blue) 62%, var(--gold) 62%, var(--gold) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 86%, 0 100%);
    padding: 30px 20px 44px; text-align: center;
  }
  .login-banner img { width: 84px; height: 84px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
  .login-banner h1 { font-size: 24px; margin: 12px 0 2px; color: var(--navy); text-transform: uppercase; }
  .login-banner p { color: var(--navy); opacity: 0.75; font-size: 12.5px; margin: 0; }
  .login-box { max-width: 340px; margin: -20px auto 0; text-align: center; padding: 0 18px; }
  .login-box .card { text-align: left; border-left: 4px solid var(--gold); }
  #authMsg { font-size: 12.5px; color: var(--amber); min-height: 18px; margin-top: 6px; }
  .login-sub { color: var(--muted); font-size: 11.5px; margin-top: 18px; }

  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  /* ---- squad: named list ---- */
  .squad-pick { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dotted var(--border); }
  .squad-pick input { width: auto; margin: 0; }
  .squad-pick.unavailable-row { opacity: 0.4; }

  /* ---- squad: pitch (kept literal grass green — this is a football pitch, not chrome) ---- */
  .pitch-wrap {
    position: relative; width: 100%; padding-top: 128%;
    background: #0F3D2E;
    border: 2px solid rgba(245,246,250,0.3); border-radius: 8px; overflow: hidden; margin: 14px 0;
  }
  .pitch-wrap::before {
    content: ""; position: absolute; left: 0; right: 0; top: 34%; height: 1px; background: rgba(245,246,250,0.25);
  }
  .pitch-wrap::after {
    content: ""; position: absolute; left: 50%; top: 34%; width: 90px; height: 90px; margin-left: -45px; margin-top: -45px;
    border: 1px solid rgba(245,246,250,0.25); border-radius: 50%;
  }
  .pitch-slot {
    position: absolute; width: 54px; height: 54px; margin-left: -27px; margin-top: -27px;
    border-radius: 50%; border: 2px dashed rgba(245,246,250,0.4);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-size: 10.5px; font-weight: 700; text-align: center; line-height: 1.15;
    cursor: pointer; background: rgba(0,0,0,0.2); color: var(--chalk); padding: 2px; user-select: none;
  }
  .pitch-slot .slot-label { font-size: 9px; opacity: 0.7; letter-spacing: 0.3px; }
  .pitch-slot.filled { border-style: solid; border-color: var(--gold); background: var(--gold); color: var(--navy); }
  .pitch-slot.active-pick { border-color: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,0.25); }
  .pitch-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: -4px; margin-bottom: 6px; min-height: 16px; }

  .bench-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .bench-chip {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 12.5px;
    cursor: pointer; background: var(--navy); color: var(--chalk);
  }
  .bench-chip:hover { border-color: var(--gold); }
  .bench-chip.unavailable-chip { opacity: 0.4; }
  .bench-label { font-size: 10.5px; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.5px; }

  /* ---- stats ---- */
  .streak-line { font-size: 14px; margin-bottom: 4px; }
  .streak-line b { color: var(--gold); }
  .streak-dots { display: flex; gap: 5px; margin-top: 8px; }
  .streak-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .streak-dot.available { background: var(--green); }
  .streak-dot.maybe { background: var(--amber); }
  .streak-dot.unavailable { background: var(--clay); }
  .stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stat-name { width: 120px; font-size: 13px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 8px; background: var(--navy); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--gold); }
  .stat-pct { width: 40px; text-align: right; font-size: 12.5px; color: var(--muted); }
  .stats-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .stats-head h3 { margin: 0; }

  .chant { text-align: center; font-size: 10px; letter-spacing: 3px; color: var(--gold); opacity: 0.6; margin: 28px 0 4px; text-transform: uppercase; }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.15s ease; }
  }
</style>
</head>

<script>
// ============================================================
// CONFIG — from your Supabase project settings (Project Settings > API).
// The anon/publishable key is safe to expose client-side; row-level
// security in schema.sql controls what it can actually do.

const SUPABASE_URL = "https://bshkctvgcvkyaepkrqgm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gR5ryLtv5VI91tHQ_DY_hg_OnYoSGxi";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;          // profile row for the logged-in user
let players = [];       // full roster
let events = [];        // all fixtures
let rsvps = [];         // all rsvps
let squads = [];        // all squad rows

let expandedEvents = new Set();   // compact fixture rows currently expanded
let activeSlotId = null;          // pitch slot awaiting a player assignment
let currentSquadEventId = null;   // which fixture the squad view is showing

// standard 4-4-2 layout, percentage positions on the pitch
const FORMATION = [
  { id: "gk",  label: "GK", x: 50, y: 91 },
  { id: "lb",  label: "LB", x: 14, y: 73 },
  { id: "lcb", label: "CB", x: 37, y: 77 },
  { id: "rcb", label: "CB", x: 63, y: 77 },
  { id: "rb",  label: "RB", x: 86, y: 73 },
  { id: "lm",  label: "LM", x: 12, y: 47 },
  { id: "lcm", label: "CM", x: 38, y: 51 },
  { id: "rcm", label: "CM", x: 62, y: 51 },
  { id: "rm",  label: "RM", x: 88, y: 47 },
  { id: "lf",  label: "FW", x: 35, y: 19 },
  { id: "rf",  label: "FW", x: 65, y: 19 },
];

// ---------- auth ----------
document.getElementById("btnSignIn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  document.getElementById("authMsg").textContent = error ? error.message : "";
  if (!error) boot();
};

document.getElementById("btnSignUp").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (password.length < 6) {
    document.getElementById("authMsg").textContent = "Password needs at least 6 characters.";
    return;
  }
  const { error } = await sb.auth.signUp({ email, password });
  document.getElementById("authMsg").textContent = error
    ? error.message
    : "Account created — check your email to confirm, then sign in.";
};

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

// ---------- boot ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const { data: profile, error } = await sb
    .from("profiles")
    .select("*")
    .eq("auth_user_id", session.user.id)
    .single();

  if (error || !profile) {
    document.getElementById("authMsg").textContent =
      "No roster entry found for this email — ask your coach to add you first.";
    await sb.auth.signOut();
    return;
  }

  me = profile;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("who").innerHTML =
    `${me.full_name}${me.is_coach ? " · Coach" : ""} <button id="signout">Sign out</button>`;
  document.getElementById("signout").onclick = signOut;

  if (me.is_coach) {
    document.getElementById("coachNewEvent").style.display = "block";
    document.getElementById("coachNewPlayer").style.display = "block";
    document.getElementById("tabSquad").style.display = "block";
    document.getElementById("btnExportCsv").style.display = "inline-block";
  }

  await refreshAll();
}

async function refreshAll() {
  const [p, e, r, s] = await Promise.all([
    sb.from("profiles").select("*").order("full_name"),
    sb.from("events").select("*").order("event_date"),
    sb.from("rsvps").select("*"),
    sb.from("squads").select("*"),
  ]);
  players = p.data || [];
  events = e.data || [];
  rsvps = r.data || [];
  squads = s.data || [];
  renderFixtures();
  renderRoster();
  renderSquadPicker();
  renderStats();
}

// ---------- tabs ----------
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll("section.view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
  };
});

// ---------- shared helpers ----------
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) +
         " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function fmtDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}

function cutoffInfo(iso) {
  if (!iso) return null;
  const diffMs = new Date(iso).getTime() - Date.now();
  if (diffMs <= 0) return { text: "RSVP cutoff has passed", cls: "over" };
  const hours = diffMs / 3600000;
  const d = Math.floor(hours / 24);
  const h = Math.floor(hours % 24);
  const text = d > 0 ? `${d}d ${h}h to respond` : `${h}h to respond`;
  return { text, cls: hours < 24 ? "warn" : "ok" };
}

function segmentedHTML(ev, myStatus, large) {
  return `
    <div class="segmented ${large ? "large" : ""}">
      <button data-ev="${ev.id}" data-status="available" class="${myStatus === "available" ? "selected available" : ""}">Available</button>
      <button data-ev="${ev.id}" data-status="maybe" class="${myStatus === "maybe" ? "selected maybe" : ""}">Maybe</button>
      <button data-ev="${ev.id}" data-status="unavailable" class="${myStatus === "unavailable" ? "selected unavailable" : ""}">Can't make it</button>
    </div>`;
}

// ---------- fixtures ----------
function fixtureBodyHTML(ev, large) {
  const myRsvp = rsvps.find(r => r.event_id === ev.id && r.player_id === me.id);
  const eventRsvps = rsvps.filter(r => r.event_id === ev.id);
  const counts = { available: 0, maybe: 0, unavailable: 0 };
  eventRsvps.forEach(r => counts[r.status]++);
  const pending = players.length - eventRsvps.length;
  const cutoff = cutoffInfo(ev.rsvp_cutoff);

  const rosterLines = players.map(p => {
    const r = eventRsvps.find(x => x.player_id === p.id);
    const status = r ? r.status : "pending";
    return `<div class="player-line"><span>${p.full_name}</span><span class="status-pill ${status}">${status}</span></div>`;
  }).join("");

  return `
    <div class="meta">${fmtDate(ev.event_date)}${ev.location ? " · " + ev.location : ""}</div>
    ${segmentedHTML(ev, myRsvp?.status, large)}
    ${cutoff ? `<div class="cutoff-label ${cutoff.cls}">${cutoff.text}</div>` : ""}
    <div class="attend-summary">
      <span><b>${counts.available}</b> in</span>
      <span><b>${counts.maybe}</b> maybe</span>
      <span><b>${counts.unavailable}</b> out</span>
      <span><b>${pending}</b> no reply</span>
    </div>
    <details class="roster-detail"><summary>View full list</summary>${rosterLines}</details>
  `;
}

function renderFixtures() {
  const el = document.getElementById("fixturesList");
  const upcoming = events
    .filter(e => new Date(e.event_date) >= new Date(Date.now() - 1000 * 60 * 60 * 6))
    .sort((a, b) => new Date(a.event_date) - new Date(b.event_date));

  if (upcoming.length === 0) {
    el.innerHTML = `<div class="empty">No fixtures yet.</div>`;
    return;
  }

  const [heroEv, ...restEv] = upcoming;

  const heroHTML = `
    <div class="card fixture-hero">
      <span class="tag ${heroEv.type}">${heroEv.type}</span>
      <h3 style="display:inline;">${heroEv.title}</h3>
      ${fixtureBodyHTML(heroEv, true)}
    </div>
  `;

  const restHTML = restEv.map(ev => {
    const myRsvp = rsvps.find(r => r.event_id === ev.id && r.player_id === me.id);
    const isOpen = expandedEvents.has(ev.id);
    return `
      <div>
        <div class="fixture-row-compact" data-toggle="${ev.id}">
          <div class="frc-left">
            <span class="tag ${ev.type}">${ev.type}</span>
            <span class="frc-title">${ev.title}</span>
          </div>
          <div class="frc-right">
            <span class="frc-date">${fmtDateShort(ev.event_date)}</span>
            <span class="status-pill ${myRsvp?.status || "pending"}">${myRsvp?.status || "no reply"}</span>
            <span class="frc-chevron ${isOpen ? "open" : ""}">&#9656;</span>
          </div>
        </div>
        ${isOpen ? `<div class="fixture-expanded">${fixtureBodyHTML(ev, false)}</div>` : ""}
      </div>
    `;
  }).join("");

  el.innerHTML = heroHTML + restHTML;

  el.querySelectorAll(".segmented button").forEach(btn => {
    btn.onclick = () => setRsvp(btn.dataset.ev, btn.dataset.status);
  });
  el.querySelectorAll("[data-toggle]").forEach(row => {
    row.onclick = () => {
      const id = row.dataset.toggle;
      if (expandedEvents.has(id)) expandedEvents.delete(id);
      else expandedEvents.add(id);
      renderFixtures();
    };
  });
}

async function setRsvp(eventId, status) {
  await sb.from("rsvps").upsert(
    { event_id: eventId, player_id: me.id, status, responded_at: new Date().toISOString() },
    { onConflict: "event_id,player_id" }
  );
  await refreshAll();
}

document.getElementById("btnAddEvent")?.addEventListener("click", async () => {
  const type = document.getElementById("evType").value;
  const title = document.getElementById("evTitle").value.trim();
  const date = document.getElementById("evDate").value;
  const location = document.getElementById("evLocation").value.trim();
  const cutoff = document.getElementById("evCutoff").value;
  if (!title || !date) { alert("Title and date are required."); return; }
  await sb.from("events").insert({
    type, title, location: location || null,
    event_date: new Date(date).toISOString(),
    rsvp_cutoff: cutoff ? new Date(cutoff).toISOString() : null,
    created_by: me.id,
  });
  document.getElementById("evTitle").value = "";
  document.getElementById("evLocation").value = "";
  await refreshAll();
});

// ---------- roster ----------
function renderRoster() {
  const el = document.getElementById("rosterList");
  el.innerHTML = players.map(p => `
    <div class="card" style="padding:12px 18px;">
      <div class="player-line" style="border:none;">
        <span>${p.full_name}${p.is_coach ? " · Coach" : ""}</span>
        <span class="meta">${p.position || ""}</span>
      </div>
    </div>
  `).join("");
}

document.getElementById("btnAddPlayer")?.addEventListener("click", async () => {
  const full_name = document.getElementById("plName").value.trim();
  const email = document.getElementById("plEmail").value.trim();
  const position = document.getElementById("plPosition").value.trim();
  if (!full_name || !email) { alert("Name and email are required."); return; }
  const { error } = await sb.from("profiles").insert({ full_name, email, position: position || null });
  if (error) { alert(error.message); return; }
  document.getElementById("plName").value = "";
  document.getElementById("plEmail").value = "";
  document.getElementById("plPosition").value = "";
  await refreshAll();
});

// ---------- squad builder ----------
function renderSquadPicker() {
  if (!me?.is_coach) return;
  const sel = document.getElementById("squadEventPick");
  const upcoming = events
    .filter(e => new Date(e.event_date) >= new Date(Date.now() - 1000 * 60 * 60 * 6))
    .sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
  sel.innerHTML = upcoming.map(e => `<option value="${e.id}">${e.title} — ${fmtDateShort(e.event_date)}</option>`).join("");
  sel.onchange = () => { activeSlotId = null; renderSquadForEvent(sel.value); };
  if (upcoming.length) {
    if (!currentSquadEventId || !upcoming.find(e => e.id === currentSquadEventId)) {
      currentSquadEventId = sel.value;
    } else {
      sel.value = currentSquadEventId;
    }
    renderSquadForEvent(sel.value);
  } else {
    document.getElementById("squadPicker").innerHTML = `<div class="empty">No fixtures yet.</div>`;
  }
}

function playerAbbrev(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 8);
  return parts[0] + " " + parts[parts.length - 1][0] + ".";
}

function renderSquadForEvent(eventId) {
  currentSquadEventId = eventId;
  const squad = squads.find(s => s.event_id === eventId);
  const namedIds = new Set(squad?.selected_player_ids || []);
  const positions = { ...(squad?.positions || {}) };
  const el = document.getElementById("squadPicker");

  // --- named squad checklist ---
  const checklistHTML = `<div class="card">
    <h3 style="margin-bottom:8px;">Name the squad</h3>
    ${players.map(p => {
      const r = rsvps.find(x => x.event_id === eventId && x.player_id === p.id);
      const status = r ? r.status : "pending";
      const unavailable = status === "unavailable";
      return `
        <label class="squad-pick ${unavailable ? "unavailable-row" : ""}">
          <input type="checkbox" data-pid="${p.id}" ${namedIds.has(p.id) ? "checked" : ""} />
          <span style="flex:1;">${p.full_name}</span>
          <span class="status-pill ${status}">${status}</span>
        </label>`;
    }).join("")}
    <button class="primary" id="btnSaveSquad" style="margin-top:14px;">Save named squad</button>
  </div>`;

  // --- pitch (only once players are named) ---
  let pitchHTML = "";
  if (namedIds.size > 0) {
    const namedPlayers = players.filter(p => namedIds.has(p.id));
    const placedIds = new Set(Object.values(positions).filter(Boolean));
    const benchPlayers = namedPlayers.filter(p => !placedIds.has(p.id));

    const slotsHTML = FORMATION.map(slot => {
      const pid = positions[slot.id];
      const player = pid ? players.find(p => p.id === pid) : null;
      const filled = !!player;
      const active = activeSlotId === slot.id;
      return `
        <div class="pitch-slot ${filled ? "filled" : ""} ${active ? "active-pick" : ""}" data-slot="${slot.id}"
             style="left:${slot.x}%; top:${slot.y}%;">
          ${filled ? playerAbbrev(player.full_name) : `<span class="slot-label">${slot.label}</span>`}
        </div>`;
    }).join("");

    const hint = activeSlotId
      ? "Tap a player below to place them"
      : "Tap an empty spot, then tap a player — or just tap a player to auto-place them";

    const benchHTML = benchPlayers.map(p => {
      const r = rsvps.find(x => x.event_id === eventId && x.player_id === p.id);
      const status = r ? r.status : "pending";
      return `<div class="bench-chip ${status === "unavailable" ? "unavailable-chip" : ""}" data-pool="${p.id}">${p.full_name}</div>`;
    }).join("");

    pitchHTML = `
      <div class="card">
        <h3>Starting XI</h3>
        <div class="pitch-hint">${hint}</div>
        <div class="pitch-wrap">${slotsHTML}</div>
        <div class="bench-label">Named squad, not yet placed</div>
        <div class="bench-pool">${benchHTML || '<span class="meta">Everyone named is on the pitch.</span>'}</div>
      </div>
    `;
  }

  el.innerHTML = checklistHTML + pitchHTML;

  document.getElementById("btnSaveSquad").onclick = async () => {
    const ids = [...el.querySelectorAll("input[type=checkbox]:checked")].map(cb => cb.dataset.pid);
    const keptPositions = {};
    Object.entries(positions).forEach(([slot, pid]) => {
      if (ids.includes(pid)) keptPositions[slot] = pid;
    });
    await sb.from("squads").upsert(
      { event_id: eventId, selected_player_ids: ids, positions: keptPositions, updated_at: new Date().toISOString() },
      { onConflict: "event_id" }
    );
    activeSlotId = null;
    await refreshAll();
  };

  el.querySelectorAll(".pitch-slot").forEach(slotEl => {
    slotEl.onclick = () => {
      const slotId = slotEl.dataset.slot;
      if (positions[slotId]) {
        // filled slot: tap to send that player back to the bench
        savePositions(eventId, namedIds, positions, slotId, null);
      } else {
        activeSlotId = (activeSlotId === slotId) ? null : slotId;
        renderSquadForEvent(eventId);
      }
    };
  });

  el.querySelectorAll(".bench-chip").forEach(chipEl => {
    chipEl.onclick = () => {
      const pid = chipEl.dataset.pool;
      let slotId = activeSlotId;
      if (!slotId) {
        const emptySlot = FORMATION.find(s => !positions[s.id]);
        slotId = emptySlot?.id;
      }
      if (!slotId) return; // pitch is full
      savePositions(eventId, namedIds, positions, slotId, pid);
    };
  });
}

async function savePositions(eventId, namedIds, positions, slotId, playerId) {
  const next = { ...positions };
  if (playerId) next[slotId] = playerId;
  else delete next[slotId];
  activeSlotId = null;
  await sb.from("squads").upsert(
    { event_id: eventId, selected_player_ids: [...namedIds], positions: next, updated_at: new Date().toISOString() },
    { onConflict: "event_id" }
  );
  await refreshAll();
}

// ---------- stats ----------
function renderMyStreak() {
  const el = document.getElementById("myStreak");
  const pastEvents = events
    .filter(e => new Date(e.event_date) < new Date())
    .sort((a, b) => new Date(b.event_date) - new Date(a.event_date))
    .slice(0, 5);

  if (pastEvents.length === 0) {
    el.innerHTML = "";
    return;
  }

  const dots = pastEvents.slice().reverse().map(ev => {
    const r = rsvps.find(x => x.event_id === ev.id && x.player_id === me.id);
    const status = r ? r.status : "pending";
    return `<div class="streak-dot ${status}" title="${ev.title}: ${status}"></div>`;
  }).join("");

  const availableCount = pastEvents.filter(ev => {
    const r = rsvps.find(x => x.event_id === ev.id && x.player_id === me.id);
    return r?.status === "available";
  }).length;

  el.innerHTML = `
    <div class="card">
      <div class="streak-line">You made <b>${availableCount} of your last ${pastEvents.length}</b> sessions</div>
      <div class="streak-dots">${dots}</div>
    </div>
  `;
}

function renderStats() {
  renderMyStreak();
  const el = document.getElementById("statsList");
  const pastOrAll = events;
  if (pastOrAll.length === 0 || players.length === 0) {
    el.innerHTML = `<div class="empty">No data yet.</div>`;
    return;
  }
  const rows = players.map(p => {
    const mine = rsvps.filter(r => r.player_id === p.id);
    const available = mine.filter(r => r.status === "available").length;
    const pct = pastOrAll.length ? Math.round((available / pastOrAll.length) * 100) : 0;
    return { name: p.full_name, pct };
  }).sort((a, b) => b.pct - a.pct);

  el.innerHTML = rows.map(r => `
    <div class="stat-row">
      <div class="stat-name">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;"></div></div>
      <div class="stat-pct">${r.pct}%</div>
    </div>
  `).join("");
}

document.getElementById("btnExportCsv")?.addEventListener("click", () => {
  const sortedEvents = [...events].sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
  const header = ["Player", ...sortedEvents.map(e => `${e.title} (${fmtDateShort(e.event_date)})`)];
  const rows = players.map(p => {
    const cells = sortedEvents.map(ev => {
      const r = rsvps.find(x => x.event_id === ev.id && x.player_id === p.id);
      return r ? r.status : "no reply";
    });
    return [p.full_name, ...cells];
  });
  const csv = [header, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "teamsheet-attendance.csv";
  a.click();
  URL.revokeObjectURL(url);
});

// ---------- go ----------
boot();
</script>
