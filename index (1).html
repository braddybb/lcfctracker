<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teamsheet — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js"></script>
<style>
  :root {
    --pitch:        #0F3D2E;
    --pitch-line:   #1F5B45;
    --pitch-deep:   #0A2C21;
    --chalk:        #F5F3EC;
    --chalk-dim:    #C9D6CD;
    --amber:        #E8A33D;
    --clay:         #C1502E;
    --muted:        #7FA491;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--pitch);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  body {
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 79px, var(--pitch-line) 79px, var(--pitch-line) 80px);
    min-height: 100vh;
  }
  h1, h2, h3, .num {
    font-family: 'Archivo Expanded', system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: 0.2px;
  }
  a { color: var(--amber); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 80px; }

  /* ---- header ---- */
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--chalk);
    padding-bottom: 14px; margin-bottom: 20px;
  }
  header.top h1 { font-size: 22px; margin: 0; }
  header.top h1 span { color: var(--amber); }
  #who { font-size: 13px; color: var(--chalk-dim); }
  #signout { background: none; border: none; color: var(--chalk-dim); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; margin-left: 10px; }

  /* ---- nav ---- */
  nav.tabs { display: flex; gap: 2px; margin-bottom: 22px; }
  nav.tabs button {
    flex: 1; background: var(--pitch-deep); color: var(--chalk-dim);
    border: 1px solid var(--pitch-line); padding: 10px 4px;
    font-family: 'Archivo Expanded', sans-serif; font-weight: 700; font-size: 12.5px;
    letter-spacing: 0.4px; cursor: pointer; border-radius: var(--radius);
  }
  nav.tabs button.active { background: var(--amber); color: var(--pitch-deep); border-color: var(--amber); }

  section.view { display: none; }
  section.view.active { display: block; }

  /* ---- cards ---- */
  .card {
    background: var(--pitch-deep);
    border: 1px solid var(--pitch-line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card h3 { font-size: 15px; margin: 0 0 4px; }
  .meta { color: var(--chalk-dim); font-size: 12.5px; }
  .tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px;
    padding: 2px 7px; border-radius: 2px; margin-right: 6px; vertical-align: middle;
  }
  .tag.game { background: var(--amber); color: var(--pitch-deep); }
  .tag.training { background: var(--pitch-line); color: var(--chalk); }

  /* ---- rsvp buttons ---- */
  .rsvp-row { display: flex; gap: 8px; margin-top: 12px; }
  .rsvp-row button {
    flex: 1; padding: 9px 0; border-radius: var(--radius); border: 1px solid var(--pitch-line);
    background: transparent; color: var(--chalk-dim); font-weight: 600; cursor: pointer; font-size: 13px;
  }
  .rsvp-row button.selected.available   { background: #2E7D5B; border-color: #2E7D5B; color: var(--chalk); }
  .rsvp-row button.selected.maybe       { background: var(--amber); border-color: var(--amber); color: var(--pitch-deep); }
  .rsvp-row button.selected.unavailable { background: var(--clay); border-color: var(--clay); color: var(--chalk); }

  .attend-summary { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--chalk-dim); }
  .attend-summary b { color: var(--chalk); }
  details.roster-detail { margin-top: 10px; }
  details.roster-detail summary { cursor: pointer; color: var(--amber); font-size: 12.5px; }
  .player-line { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dotted var(--pitch-line); font-size: 13px; }
  .status-pill { font-size: 11px; padding: 1px 6px; border-radius: 2px; }
  .status-pill.available { background: #2E7D5B33; color: #6FD1A6; }
  .status-pill.maybe { background: #E8A33D33; color: var(--amber); }
  .status-pill.unavailable { background: #C1502E33; color: #E08064; }
  .status-pill.pending { background: #ffffff11; color: var(--chalk-dim); }

  /* ---- forms ---- */
  input, select, textarea {
    width: 100%; background: var(--pitch); border: 1px solid var(--pitch-line); color: var(--chalk);
    padding: 9px 10px; border-radius: var(--radius); font-family: inherit; font-size: 14px; margin-bottom: 10px;
  }
  label { font-size: 12px; color: var(--chalk-dim); display: block; margin-bottom: 3px; }
  button.primary {
    background: var(--amber); color: var(--pitch-deep); border: none; padding: 10px 18px;
    font-weight: 700; border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  button.ghost {
    background: none; color: var(--chalk-dim); border: 1px solid var(--pitch-line);
    padding: 10px 18px; border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }

  /* ---- login ---- */
  .login-box { max-width: 340px; margin: 12vh auto 0; text-align: center; }
  .login-box h1 { font-size: 26px; margin-bottom: 4px; }
  .login-box p.sub { color: var(--chalk-dim); font-size: 13px; margin-bottom: 24px; }
  .login-box .card { text-align: left; }
  #authMsg { font-size: 12.5px; color: var(--amber); min-height: 18px; margin-top: 6px; }

  .empty { color: var(--chalk-dim); font-size: 13px; padding: 20px 0; text-align: center; }

  /* ---- squad builder ---- */
  .squad-pick { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dotted var(--pitch-line); }
  .squad-pick input { width: auto; margin: 0; }
  .squad-pick.unavailable { opacity: 0.4; }

  /* ---- stats ---- */
  .stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stat-name { width: 120px; font-size: 13px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--pitch); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--amber); }
  .stat-pct { width: 40px; text-align: right; font-size: 12.5px; color: var(--chalk-dim); }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.15s ease; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="wrap login-box">
  <h1>Teamsheet</h1>
  <p class="sub">Training &amp; match availability for the squad.</p>
  <div class="card">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row2">
      <button class="primary" id="btnSignIn">Sign in</button>
      <button class="ghost" id="btnSignUp">Create account</button>
    </div>
    <div id="authMsg"></div>
  </div>
  <p class="sub" style="font-size:11.5px;">New players: ask your coach to add you to the roster first, then create your account with the same email.</p>
</div>

<div id="app" class="wrap" style="display:none;">
  <header class="top">
    <h1>Team<span>sheet</span></h1>
    <div id="who"></div>
  </header>

  <nav class="tabs">
    <button data-view="fixtures" class="active">Fixtures</button>
    <button data-view="roster">Roster</button>
    <button data-view="squad" id="tabSquad" style="display:none;">Squad</button>
    <button data-view="stats">Stats</button>
  </nav>

  <!-- FIXTURES -->
  <section id="view-fixtures" class="view active">
    <div id="coachNewEvent" style="display:none;" class="card">
      <h3>New fixture</h3>
      <div class="row2">
        <div>
          <label>Type</label>
          <select id="evType"><option value="training">Training</option><option value="game">Game</option></select>
        </div>
        <div>
          <label>Date &amp; time</label>
          <input id="evDate" type="datetime-local" />
        </div>
      </div>
      <label>Title</label>
      <input id="evTitle" placeholder="e.g. Tuesday session, or Round 4 vs Hawks" />
      <div class="row2">
        <div>
          <label>Location</label>
          <input id="evLocation" placeholder="Ground / venue" />
        </div>
        <div>
          <label>RSVP cutoff</label>
          <input id="evCutoff" type="datetime-local" />
        </div>
      </div>
      <button class="primary" id="btnAddEvent">Add fixture</button>
    </div>
    <div id="fixturesList"></div>
  </section>

  <!-- ROSTER -->
  <section id="view-roster" class="view">
    <div id="coachNewPlayer" style="display:none;" class="card">
      <h3>Add a player</h3>
      <div class="row2">
        <div>
          <label>Full name</label>
          <input id="plName" />
        </div>
        <div>
          <label>Email (they sign up with this)</label>
          <input id="plEmail" type="email" />
        </div>
      </div>
      <label>Position (optional)</label>
      <input id="plPosition" />
      <button class="primary" id="btnAddPlayer">Add to roster</button>
    </div>
    <div id="rosterList"></div>
  </section>

  <!-- SQUAD BUILDER (coach only) -->
  <section id="view-squad" class="view">
    <div class="card">
      <label>Pick a fixture</label>
      <select id="squadEventPick"></select>
    </div>
    <div id="squadPicker"></div>
  </section>

  <!-- STATS -->
  <section id="view-stats" class="view">
    <div class="card">
      <h3 style="margin-bottom:14px;">Availability rate, season to date</h3>
      <div id="statsList"></div>
    </div>
  </section>
</div>

<script>
// ============================================================
// CONFIG — fill these in from your Supabase project settings
// (Project Settings > API). The anon key is safe to expose client-side;
// row-level security in schema.sql controls what it can actually do.
// ============================================================
const SUPABASE_URL = "https://bshkctvgcvkyaepkrqgm.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;          // profile row for the logged-in user
let players = [];       // full roster
let events = [];        // all fixtures
let rsvps = [];         // all rsvps
let squads = [];        // all squad rows

// ---------- auth ----------
document.getElementById("btnSignIn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  document.getElementById("authMsg").textContent = error ? error.message : "";
  if (!error) boot();
};

document.getElementById("btnSignUp").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (password.length < 6) {
    document.getElementById("authMsg").textContent = "Password needs at least 6 characters.";
    return;
  }
  const { error } = await sb.auth.signUp({ email, password });
  document.getElementById("authMsg").textContent = error
    ? error.message
    : "Account created — check your email to confirm, then sign in.";
};

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

// ---------- boot ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const { data: profile, error } = await sb
    .from("profiles")
    .select("*")
    .eq("auth_user_id", session.user.id)
    .single();

  if (error || !profile) {
    document.getElementById("authMsg").textContent =
      "No roster entry found for this email — ask your coach to add you first.";
    await sb.auth.signOut();
    return;
  }

  me = profile;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("who").innerHTML =
    `${me.full_name}${me.is_coach ? " · Coach" : ""} <button id="signout">Sign out</button>`;
  document.getElementById("signout").onclick = signOut;

  if (me.is_coach) {
    document.getElementById("coachNewEvent").style.display = "block";
    document.getElementById("coachNewPlayer").style.display = "block";
    document.getElementById("tabSquad").style.display = "block";
  }

  await refreshAll();
}

async function refreshAll() {
  const [p, e, r, s] = await Promise.all([
    sb.from("profiles").select("*").order("full_name"),
    sb.from("events").select("*").order("event_date"),
    sb.from("rsvps").select("*"),
    sb.from("squads").select("*"),
  ]);
  players = p.data || [];
  events = e.data || [];
  rsvps = r.data || [];
  squads = s.data || [];
  renderFixtures();
  renderRoster();
  renderSquadPicker();
  renderStats();
}

// ---------- tabs ----------
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll("section.view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
  };
});

// ---------- fixtures ----------
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) +
         " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function renderFixtures() {
  const el = document.getElementById("fixturesList");
  const upcoming = events.filter(e => new Date(e.event_date) >= new Date(Date.now() - 1000*60*60*6));
  if (upcoming.length === 0) {
    el.innerHTML = `<div class="empty">No fixtures yet.</div>`;
    return;
  }
  el.innerHTML = upcoming.map(ev => {
    const myRsvp = rsvps.find(r => r.event_id === ev.id && r.player_id === me.id);
    const eventRsvps = rsvps.filter(r => r.event_id === ev.id);
    const counts = { available: 0, maybe: 0, unavailable: 0 };
    eventRsvps.forEach(r => counts[r.status]++);
    const pending = players.length - eventRsvps.length;

    const rosterLines = players.map(p => {
      const r = eventRsvps.find(x => x.player_id === p.id);
      const status = r ? r.status : "pending";
      return `<div class="player-line"><span>${p.full_name}</span><span class="status-pill ${status}">${status}</span></div>`;
    }).join("");

    return `
      <div class="card">
        <span class="tag ${ev.type}">${ev.type}</span>
        <h3 style="display:inline;">${ev.title}</h3>
        <div class="meta">${fmtDate(ev.event_date)}${ev.location ? " · " + ev.location : ""}${ev.rsvp_cutoff ? " · RSVP by " + fmtDate(ev.rsvp_cutoff) : ""}</div>
        <div class="rsvp-row">
          <button data-ev="${ev.id}" data-status="available" class="${myRsvp?.status === "available" ? "selected available" : ""}">Available</button>
          <button data-ev="${ev.id}" data-status="maybe" class="${myRsvp?.status === "maybe" ? "selected maybe" : ""}">Maybe</button>
          <button data-ev="${ev.id}" data-status="unavailable" class="${myRsvp?.status === "unavailable" ? "selected unavailable" : ""}">Can't make it</button>
        </div>
        <div class="attend-summary">
          <span><b>${counts.available}</b> in</span>
          <span><b>${counts.maybe}</b> maybe</span>
          <span><b>${counts.unavailable}</b> out</span>
          <span><b>${pending}</b> no reply</span>
        </div>
        <details class="roster-detail"><summary>View full list</summary>${rosterLines}</details>
      </div>
    `;
  }).join("");

  el.querySelectorAll(".rsvp-row button").forEach(btn => {
    btn.onclick = () => setRsvp(btn.dataset.ev, btn.dataset.status);
  });
}

async function setRsvp(eventId, status) {
  await sb.from("rsvps").upsert(
    { event_id: eventId, player_id: me.id, status, responded_at: new Date().toISOString() },
    { onConflict: "event_id,player_id" }
  );
  await refreshAll();
}

document.getElementById("btnAddEvent")?.addEventListener("click", async () => {
  const type = document.getElementById("evType").value;
  const title = document.getElementById("evTitle").value.trim();
  const date = document.getElementById("evDate").value;
  const location = document.getElementById("evLocation").value.trim();
  const cutoff = document.getElementById("evCutoff").value;
  if (!title || !date) { alert("Title and date are required."); return; }
  await sb.from("events").insert({
    type, title, location: location || null,
    event_date: new Date(date).toISOString(),
    rsvp_cutoff: cutoff ? new Date(cutoff).toISOString() : null,
    created_by: me.id,
  });
  document.getElementById("evTitle").value = "";
  document.getElementById("evLocation").value = "";
  await refreshAll();
});

// ---------- roster ----------
function renderRoster() {
  const el = document.getElementById("rosterList");
  el.innerHTML = players.map(p => `
    <div class="card" style="padding:12px 18px;">
      <div class="player-line" style="border:none;">
        <span>${p.full_name}${p.is_coach ? " · Coach" : ""}</span>
        <span class="meta">${p.position || ""}</span>
      </div>
    </div>
  `).join("");
}

document.getElementById("btnAddPlayer")?.addEventListener("click", async () => {
  const full_name = document.getElementById("plName").value.trim();
  const email = document.getElementById("plEmail").value.trim();
  const position = document.getElementById("plPosition").value.trim();
  if (!full_name || !email) { alert("Name and email are required."); return; }
  const { error } = await sb.from("profiles").insert({ full_name, email, position: position || null });
  if (error) { alert(error.message); return; }
  document.getElementById("plName").value = "";
  document.getElementById("plEmail").value = "";
  document.getElementById("plPosition").value = "";
  await refreshAll();
});

// ---------- squad builder ----------
function renderSquadPicker() {
  if (!me?.is_coach) return;
  const sel = document.getElementById("squadEventPick");
  const upcoming = events.filter(e => new Date(e.event_date) >= new Date(Date.now() - 1000*60*60*6));
  sel.innerHTML = upcoming.map(e => `<option value="${e.id}">${e.title} — ${fmtDate(e.event_date)}</option>`).join("");
  sel.onchange = () => renderSquadForEvent(sel.value);
  if (upcoming.length) renderSquadForEvent(sel.value);
  else document.getElementById("squadPicker").innerHTML = `<div class="empty">No fixtures yet.</div>`;
}

function renderSquadForEvent(eventId) {
  const squad = squads.find(s => s.event_id === eventId);
  const selected = new Set(squad?.selected_player_ids || []);
  const el = document.getElementById("squadPicker");
  el.innerHTML = `<div class="card">` + players.map(p => {
    const r = rsvps.find(x => x.event_id === eventId && x.player_id === p.id);
    const status = r ? r.status : "pending";
    const unavailable = status === "unavailable";
    return `
      <label class="squad-pick ${unavailable ? "unavailable" : ""}">
        <input type="checkbox" data-pid="${p.id}" ${selected.has(p.id) ? "checked" : ""} />
        <span style="flex:1;">${p.full_name}</span>
        <span class="status-pill ${status}">${status}</span>
      </label>`;
  }).join("") + `<button class="primary" id="btnSaveSquad" style="margin-top:14px;">Save squad</button></div>`;

  document.getElementById("btnSaveSquad").onclick = async () => {
    const ids = [...el.querySelectorAll("input[type=checkbox]:checked")].map(cb => cb.dataset.pid);
    await sb.from("squads").upsert(
      { event_id: eventId, selected_player_ids: ids, updated_at: new Date().toISOString() },
      { onConflict: "event_id" }
    );
    await refreshAll();
  };
}

// ---------- stats ----------
function renderStats() {
  const el = document.getElementById("statsList");
  const pastOrAll = events; // keep simple: rate across all fixtures posted so far
  if (pastOrAll.length === 0 || players.length === 0) {
    el.innerHTML = `<div class="empty">No data yet.</div>`;
    return;
  }
  const rows = players.map(p => {
    const mine = rsvps.filter(r => r.player_id === p.id);
    const available = mine.filter(r => r.status === "available").length;
    const pct = pastOrAll.length ? Math.round((available / pastOrAll.length) * 100) : 0;
    return { name: p.full_name, pct };
  }).sort((a, b) => b.pct - a.pct);

  el.innerHTML = rows.map(r => `
    <div class="stat-row">
      <div class="stat-name">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;"></div></div>
      <div class="stat-pct">${r.pct}%</div>
    </div>
  `).join("");
}

// ---------- go ----------
boot();
</script>
</body>
</html>
